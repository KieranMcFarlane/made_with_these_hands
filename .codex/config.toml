# Made With These Hands uses Nakano's tenant-bound OAuth gateway. Authentication
# is stored by Codex; no Directus or Factory bearer token belongs on the client.

[mcp_servers.nakano]
url = "https://mcp.nakanodigital.com/mcp"
auth = "oauth"
oauth_resource = "https://mcp.nakanodigital.com/mcp"
required = false
default_tools_approval_mode = "auto"
tool_timeout_sec = 120
