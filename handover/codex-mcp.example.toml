# Made With These Hands Codex MCP template. Codex stores the OAuth grant in its
# credential store; the client never receives Directus or Factory service keys.

[mcp_servers.nakano]
url = "https://mcp.nakanodigital.com/mcp"
auth = "oauth"
oauth_resource = "https://mcp.nakanodigital.com/mcp"
required = false
default_tools_approval_mode = "auto"
tool_timeout_sec = 120
